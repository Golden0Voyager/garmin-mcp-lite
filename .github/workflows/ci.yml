name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check garmin_mcp_lite/ tests/ scripts/

      - name: Run mypy
        run: uv run mypy garmin_mcp_lite/
      - name: Run security scan (bandit)
        run: uv tool run bandit -r garmin_mcp_lite/ || true

      - name: Audit dependencies
        # The old step ran `uv audit` for real (uv >= 0.11) but `|| true` turned
        # every advisory into a green build. This gate reads the frozen lock, so
        # CI cannot disagree with uv.lock.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off \
            --ignore-vuln PYSEC-2026-3467
        # PYSEC-2026-3467 (garminconnect: insecure permission assignment on the
        # OAuth token store) is fixed in 0.3.5, and 0.3.5 is not adoptable yet:
        # every release from 0.3.5 on requires Python >= 3.12, which this project
        # cannot require (it still supports 3.11, whose lock split is pinned to
        # 0.3.2 regardless), and it ships `py.typed` with annotations that
        # disagree with how three tool modules use the client — adopting it turns
        # this repo's hard mypy gate red with 23 errors. Doing that migration
        # needs a live Garmin account to confirm the real return shapes, so it is
        # deliberately out of scope for a CI-gate PR.
        # Impact while pinned: the advisory is local — the token file is written
        # with permissions wider than intended. There is no remote attack surface
        # and no code path here exposes the token store. Revisit when the
        # garminconnect 0.3.5+ migration lands (tracked as a follow-up), or when
        # 3.11 support is dropped.


      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing -k 'not test_get_client' tests/

      - name: Enforce coverage threshold
        run: uv run coverage report

      # The steps above install with `uv sync`, which honours uv.lock -- so they
      # cannot see a broken *published* dependency set. 0.1.3 shipped an unbounded
      # `mcp>=1.6.0` that let lock-ignoring installers (uvx, pip) resolve mcp 2.x
      # and crash at import, while CI stayed green. This installs the built wheel
      # into a throwaway env with no lock and no overrides, then handshakes.
      - name: Smoke test the wheel (lock-free install)
        run: python3 scripts/smoke_wheel_install.py
        env:
          SMOKE_DEBUG: "1"
