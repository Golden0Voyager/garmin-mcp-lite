[project]
name = "garmin-mcp-lite"
version = "0.1.7"
description = "精简版 Garmin MCP 服务器 - 专为耐力运动爱好者设计"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Haining Yu", email = "yhn0535@gmail.com" },
]
keywords = ["mcp", "garmin", "garmin-connect", "fitness", "endurance", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Upper bound is required: mcp 2.x renamed FastMCP to MCPServer and removed
    # mcp.server.fastmcp, which server.py imports. Without <2, `uvx` (which ignores
    # uv.lock) resolves mcp 2.x and the server dies at import with
    # ModuleNotFoundError before it can speak MCP. Raise this once server.py
    # migrates to the 2.x API.
    "mcp>=1.6.0,<2.0",
    "garminconnect>=0.2.25",
    "pydantic>=2.0",
    "curl-cffi>=0.7.0",
    # Xiaomi's health cloud speaks a private RC4/SHA1-signed protocol that has
    # no client library, so the requests are made directly. garminconnect
    # already pulls requests in, but relying on a transitive dependency for a
    # module we import ourselves is how wheels break silently.
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Golden0Voyager/garmin-mcp-lite"
Repository = "https://github.com/Golden0Voyager/garmin-mcp-lite"
Issues = "https://github.com/Golden0Voyager/garmin-mcp-lite/issues"

[project.scripts]
garmin-mcp-lite = "garmin_mcp_lite.server:main"
garmin-mcp-lite-login = "garmin_mcp_lite.login:main"
# Xiaomi's login needs a captcha and an SMS code, so it cannot be a tool call.
garmin-mcp-lite-xiaomi-login = "garmin_mcp_lite.xiaomi_login:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
files = ["garmin_mcp_lite/"]

[tool.coverage.run]
source = ["garmin_mcp_lite"]
# login.py is an interactive one-shot script (reads a password from the terminal)
# and cannot be exercised in CI. server.py used to be omitted too, but that left
# the 15 tool registrations — the only place a tool's public name is defined —
# with no test coverage at all, so it is measured now (see tests/test_server.py).
# xiaomi_login.py is the same one-shot shape as login.py; the client it drives
# (xiaomi.py) is fully covered by tests/test_xiaomi.py, including the login flow.
omit = ["garmin_mcp_lite/login.py", "garmin_mcp_lite/xiaomi_login.py"]

[tool.coverage.report]
# Ratcheted from 85 after the suite reached 100%: the 5-point gap is headroom for
# an awkward branch, not a licence to drop a whole module's tests.
fail_under = 95
show_missing = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B603"]

[tool.uv]
required-version = ">=0.13.5"
